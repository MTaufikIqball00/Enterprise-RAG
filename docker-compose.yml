services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-backend
    ports:
      - "8010:8010"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      HOST: "0.0.0.0"
      BACKEND_PORT: "8010"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-CHANGE_ME_IN_LOCAL_ENV_WITH_CRYPTOGRAPHICALLY_RANDOM_SECRET}"
      ENABLE_DEMO_ACCOUNTS: "${ENABLE_DEMO_ACCOUNTS:-true}"
      DATABASE_URL: "sqlite:///./storage/enterprise_rag.db"
      RAW_DOCUMENT_STORAGE_PATH: "./storage/documents"
      LLM_PROVIDER: "${LLM_PROVIDER:-local_grounded}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-local-extractive-grounded-v1}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local_deterministic}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-local-hash-ngram-256d-v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      QDRANT_URL: "${QDRANT_URL:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - enterprise_rag_storage:/app/storage
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: enterprise-rag-frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      BACKEND_PORT: "8010"
      VITE_API_URL: "http://localhost:8010"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  enterprise_rag_storage:
  frontend_node_modules:
